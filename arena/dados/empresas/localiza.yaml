  - "Microsoft Azure e GitHub Copilot como parte da plataforma de desenvolvimento"
  - "Telemetria e rastreamento veicular de terceiros"
  - "Rede credenciada de oficinas, funilarias e guinchos"
  - "Contact center com operação parcialmente terceirizada (BPO)"
