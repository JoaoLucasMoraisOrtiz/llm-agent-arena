id: vigia_xdr
nome: Vigia XDR
tema: seguranca
empresa_vendedora:
  nome: Vigia Segurança Digital
  descricao: "Empresa brasileira de cibersegurança fundada em 2014 em Campinas (SP), com ~420 funcionários, que vende plataforma XDR própria e SOC gerenciado 24x7 operado no Brasil."
descricao_curta: "Plataforma XDR com SOC gerenciado 24x7 em português, que correlaciona endpoint, rede, identidade e nuvem para detectar e responder a incidentes."
existentes:
  - "Agente de endpoint (EDR) para Windows 10/11, Windows Server 2016+, macOS 12+ e Linux (RHEL 8/9, Ubuntu 20.04/22.04/24.04), com consumo médio de 1,5% de CPU"
  - "SOC gerenciado 24x7 em dois centros de operação (Campinas e Recife), com analistas N1/N2/N3 em português"
  - "Tempo médio de triagem (MTTA) contratual de 15 minutos para alertas críticos"
  - "Ingestão nativa de logs de Microsoft 365, Entra ID (Azure AD), Google Workspace, AWS CloudTrail, Azure Activity Log e GCP Audit Logs"
  - "Conectores para firewalls Fortinet FortiGate, Palo Alto NGFW e Check Point via syslog/CEF"
  - "Mais de 1.100 regras de detecção mapeadas no MITRE ATT&CK v15"
  - "Resposta automatizada (SOAR leve) com 40 playbooks prontos: isolar host, desabilitar usuário no Entra ID, bloquear IP no firewall"
  - "Retenção de logs quentes por 90 dias e frios por 12 meses, armazenados em data center em São Paulo (AWS sa-east-1)"
  - "Relatórios de conformidade pré-formatados para LGPD, Resolução CMN 4.893 e ISO 27001"
  - "Threat intelligence com feeds focados em ameaças brasileiras (trojans bancários como Grandoreiro, golpes de PIX, ransomware em saúde)"
  - "Console multi-tenant com RBAC e SSO via SAML 2.0"
roadmap:
  - "Módulo de proteção de identidade (ITDR) com detecção de ataques a Kerberos/AD on-premises (previsto para T1/2027)"
  - "Copiloto de investigação com IA generativa que escreve o resumo do incidente em linguagem natural (previsto para T2/2027)"
  - "Segurança de dispositivos médicos e IoT hospitalar (IoMT) com descoberta passiva de rede (previsto para T3/2027)"
  - "Agente para sistemas OT/SCADA industriais (previsto para T4/2027)"
  - "Integração bidirecional nativa com ServiceNow SecOps (previsto para T2/2027)"
limitacoes:
  - "Não possui agente para sistemas legados como Windows 7, Windows Server 2008 ou AIX"
  - "Sem cobertura de ambientes OT/SCADA e dispositivos médicos (IoMT) hoje"
  - "Integração com ServiceNow é unidirecional (apenas abre tickets, não sincroniza status)"
  - "Retenção acima de 12 meses exige contratação de armazenamento adicional cobrado à parte"
  - "Implantação completa em ambientes acima de 20 mil endpoints leva de 10 a 14 semanas"
  - "Resposta a incidentes forense presencial (DFIR) é serviço adicional, não incluído no preço de tabela"
integracoes: ["Microsoft 365 e Entra ID (nativa)", "Google Workspace (nativa)", "AWS, Azure e GCP via APIs de auditoria (nativa)", "Fortinet, Palo Alto e Check Point via syslog/CEF", "ServiceNow via API REST (unidirecional)", "Splunk via exportação HEC (não certificada)", "CrowdStrike e SentinelOne como fonte de telemetria via API (beta)"]
sla: "MTTA de 15 minutos para alertas críticos e 1 hora para altos, 99,9% de disponibilidade da console, crédito de 5% da mensalidade por violação de MTTA no mês."
implantacao: "8 a 14 semanas conforme porte; exige inventário de ativos, acesso administrativo para distribuir o agente (GPO, Intune ou SCCM), liberação de regras de firewall e um ponto focal de segurança do cliente com dedicação de 30% no período."
cases:
  - "Rede Sollare Hospitais (saúde, 14 hospitais, 22 mil endpoints): MTTR caiu de 9 horas para 2,5 horas em 6 meses e contenção de tentativa de ransomware em 38 minutos."
  - "Varejo Estrela do Sul (varejo, 480 lojas, 9 mil endpoints): redução de 71% nos falsos positivos encaminhados à equipe interna após 4 meses de ajuste."
  - "Cooperativa Crediverde (serviços financeiros, 3 mil funcionários): aprovação na auditoria da Resolução CMN 4.893 sem apontamentos em 2025."
preco_tabela_anual: 1150000
desconto_max_pct: 18
metrica_poc: "Taxa de detecção em simulação de ataque (purple team/BAS) sobre um conjunto de técnicas MITRE ATT&CK acordado, junto com o MTTA medido pelo SOC durante 30 dias."
conhecimento_categoria:
  - "MTTA/MTTR contratual em SOC gerenciado costuma ser de 15 a 30 minutos para críticos; promessas de 'resposta em 1 minuto' geralmente se referem só a automação, não a analista humano."
  - "Os primeiros 60 a 90 dias de um XDR/SOC têm alto volume de falsos positivos até o tuning das regras; resultados estáveis antes disso são raros."
  - "Nenhum fornecedor sério garante 100% de bloqueio de ransomware; avaliações como MITRE ATT&CK Evaluations mostram diferenças de cobertura entre produtos."
  - "Cobertura de OT/SCADA e dispositivos médicos exige tecnologia específica (monitoramento passivo de rede) e normalmente é um produto separado."
  - "A LGPD e a ANPD exigem comunicação de incidentes relevantes em prazo curto (3 dias úteis pela Resolução CD/ANPD 15/2024), e a residência de dados no Brasil é um critério frequente em saúde e finanças."
  - "Preço de XDR com SOC gerenciado no Brasil costuma ficar entre R$ 40 e R$ 120 por endpoint/ano mais o serviço, variando muito por volume de logs ingeridos."
  - "Retenção longa de logs (acima de 12 meses) é quase sempre cobrada à parte por volume em GB/dia."
fit_base:
  magalu: 0.85
  weg: 0.7
  localiza: 0.7
  slc: 0.55
  hapvida: 0.9
cargos_alvo: [CTO, CFO, COO]
